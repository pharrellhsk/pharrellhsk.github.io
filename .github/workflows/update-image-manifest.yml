name: Update image manifest

on:
  push:
    branches: [main, master]
    paths:
      - 'image/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/generate-image-manifest.mjs
      - name: Commit manifest
        run: |
          if git diff --quiet -- image/manifest.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image/manifest.json
          git commit -m 'chore: update image manifest'
          git push
